<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Upload Nota</title>
<style>
  :root { --bg:#f6f7f9; --card:#fff; --ink:#1d2330; --muted:#6b7280; --line:#d9dde5; --accent:#2563eb; --ok:#15803d; --err:#b91c1c; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg:#0f1218; --card:#171c25; --ink:#e7eaf0; --muted:#9aa3b2; --line:#2a3240; --accent:#60a5fa; --ok:#4ade80; --err:#f87171; }
  }
  :root[data-theme="dark"] { --bg:#0f1218; --card:#171c25; --ink:#e7eaf0; --muted:#9aa3b2; --line:#2a3240; --accent:#60a5fa; --ok:#4ade80; --err:#f87171; }
  * { box-sizing: border-box; }
  body { margin:0; padding:16px; background:var(--bg); color:var(--ink); font:15px/1.5 system-ui, sans-serif; }
  main { max-width:560px; margin:0 auto; }
  h1 { font-size:20px; margin:8px 0 16px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:10px; padding:16px; }
  button { padding:10px 16px; border:0; border-radius:7px; background:var(--accent); color:#fff; font:inherit; cursor:pointer; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  #drop { border:2px dashed var(--line); border-radius:10px; padding:28px 16px; text-align:center; color:var(--muted); }
  #drop.over { border-color:var(--accent); color:var(--ink); }
  #drop input { margin-top:10px; }
  ul { list-style:none; padding:0; margin:12px 0 0; }
  li { display:flex; justify-content:space-between; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:14px; }
  li:last-child { border-bottom:0; }
  .name { overflow-wrap:anywhere; }
  .st { white-space:nowrap; color:var(--muted); }
  .st.ok { color:var(--ok); } .st.err { color:var(--err); }
  .actions { display:flex; gap:8px; margin-top:12px; }
  .ghost { background:transparent; color:var(--muted); border:1px solid var(--line); }
</style>
</head>
<body>
<main>
  <h1>Upload Nota</h1>
  <section class="card">
    <div id="drop">
      Seret file nota ke sini (PDF, PNG, JPG)<br>
      <input type="file" id="files" multiple accept=".pdf,.png,.jpg,.jpeg">
    </div>
    <ul id="list"></ul>
    <div class="actions">
      <button id="upload" disabled>Upload ke folder Nota</button>
      <button id="clear" class="ghost">Bersihkan</button>
    </div>
  </section>
</main>

<script>
(function () {
  // ==== KONFIGURASI (isi sekali) ====
  const WEB_APP_URL = 'PASTE_URL_WEB_APP_DI_SINI';
  // ==================================

  const $ = (id) => document.getElementById(id);
  let queue = [];

  function render() {
    const ul = $('list');
    ul.innerHTML = '';
    queue.forEach((q) => {
      const li = document.createElement('li');
      const n = document.createElement('span');
      n.className = 'name';
      n.textContent = q.file.name;
      const s = document.createElement('span');
      s.className = 'st' + (q.status === 'selesai' ? ' ok' : q.status === 'gagal' ? ' err' : '');
      s.textContent = q.msg;
      li.append(n, s);
      ul.appendChild(li);
    });
    $('upload').disabled = !queue.some(q => q.status === 'siap');
  }

  function addFiles(fileList) {
    const allowed = /\.(pdf|png|jpe?g)$/i;
    for (const f of fileList) {
      queue.push(allowed.test(f.name)
        ? { file: f, status: 'siap', msg: 'siap diunggah' }
        : { file: f, status: 'gagal', msg: 'format tidak didukung' });
    }
    render();
  }

  function readBase64(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(String(r.result).split(',')[1]);
      r.onerror = () => reject(new Error('gagal membaca file'));
      r.readAsDataURL(file);
    });
  }

  async function uploadOne(item) {
    const data = await readBase64(item.file);
    const res = await fetch(WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        name: item.file.name,
        mimeType: item.file.type || 'application/octet-stream',
        data
      })
    });
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || 'gagal');
  }

  async function uploadAll() {
    $('upload').disabled = true;
    for (const item of queue) {
      if (item.status !== 'siap') continue;
      item.status = 'mengunggah';
      item.msg = 'mengunggah...';
      render();
      try {
        await uploadOne(item);
        item.status = 'selesai';
        item.msg = 'selesai';
      } catch (e) {
        item.status = 'gagal';
        item.msg = 'gagal: ' + e.message;
      }
      render();
    }
  }

  const drop = $('drop');
  ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', (e) => addFiles(e.dataTransfer.files));
  $('files').addEventListener('change', (e) => { addFiles(e.target.files); e.target.value = ''; });
  $('upload').addEventListener('click', uploadAll);
  $('clear').addEventListener('click', () => { queue = queue.filter(q => q.status === 'mengunggah'); render(); });
  render();
})();
</script>
</body>
</html>
