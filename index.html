<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Upload Nota Lab</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
  :root {
    /* Layout: satu kolom sempit, kartu tunggal, fokus pada area seret-lepas. */
    --bg: #f5f5f2;
    --surface: #ffffff;
    --ink: #1c1f24;
    --muted: #6a707b;
    --line: #dcdfe4;
    --accent: #1f5fbf;
    --ok: #17703a;
    --err: #b3261e;
    color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #101216; --surface: #181b21; --ink: #e8eaee; --muted: #9aa1ad; --line: #2b313b;
      --accent: #6ea8ff; --ok: #4fd083; --err: #ff8a80; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #101216; --surface: #181b21; --ink: #e8eaee; --muted: #9aa1ad; --line: #2b313b;
    --accent: #6ea8ff; --ok: #4fd083; --err: #ff8a80; color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 15px/1.5 "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 24px;
  }
  main { max-width: 560px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; text-wrap: balance; }
  .sub { color: var(--muted); margin: 0 0 18px; font-size: 14px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 16px; }
  #drop {
    border: 2px dashed var(--line); border-radius: 10px; padding: 28px 16px;
    text-align: center; color: var(--muted); transition: border-color .15s, color .15s;
  }
  #drop.over { border-color: var(--accent); color: var(--ink); }
  #drop label { color: var(--accent); cursor: pointer; text-decoration: underline; }
  #files { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }
  ul { list-style: none; padding: 0; margin: 14px 0 0; }
  li { display: flex; justify-content: space-between; gap: 12px; padding: 9px 0; border-bottom: 1px solid var(--line); font-size: 14px; }
  li:last-child { border-bottom: 0; }
  .name { overflow-wrap: anywhere; min-width: 0; }
  .st { white-space: nowrap; color: var(--muted); font-variant-numeric: tabular-nums; }
  .st.ok { color: var(--ok); }
  .st.err { color: var(--err); }
  .actions { display: flex; gap: 8px; margin-top: 14px; flex-wrap: wrap; }
  button {
    font: inherit; padding: 10px 16px; border-radius: 7px; border: 0;
    background: var(--accent); color: #fff; cursor: pointer;
  }
  button:disabled { opacity: .45; cursor: not-allowed; }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  button:focus-visible, #drop label:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { #drop { transition: none; } }
</style>
</head>
<body>
<main>
  <h1>Upload Nota</h1>
  <p class="sub">Unggah nota ke database nota lab fuelcell.</p>

  <section class="card">
    <div id="drop">
      Seret file nota ke sini (PDF, PNG, JPG)<br>
      atau <label for="files">pilih dari perangkat</label>
      <input type="file" id="files" multiple accept=".pdf,.png,.jpg,.jpeg">
    </div>
    <ul id="list"></ul>
    <div class="actions">
      <button id="upload" disabled>Upload</button>
      <button id="clear" class="ghost">Bersihkan daftar</button>
    </div>
  </section>
</main>

<script>
(function () {
  // Endpoint Apps Script (Web app). Tidak memakai login atau kata rahasia.
  const WEB_APP_URL = 'https://script.google.com/macros/s/AKfycbw8sXZyEE1iLEktF59Na4K8HPa148G-Namxs0R-S90mOzWra72bamx8xo1crMoKAZwx/exec';

  const $ = (id) => document.getElementById(id);
  let queue = [];

  function render() {
    const ul = $('list');
    ul.innerHTML = '';
    queue.forEach((q) => {
      const li = document.createElement('li');
      const n = document.createElement('span');
      n.className = 'name';
      n.textContent = q.file.name;
      const s = document.createElement('span');
      s.className = 'st' + (q.status === 'selesai' ? ' ok' : q.status === 'gagal' ? ' err' : '');
      s.textContent = q.msg;
      li.append(n, s);
      ul.appendChild(li);
    });
    $('upload').disabled = !queue.some(q => q.status === 'siap');
  }

  function addFiles(fileList) {
    const allowed = /\.(pdf|png|jpe?g)$/i;
    for (const f of fileList) {
      queue.push(allowed.test(f.name)
        ? { file: f, status: 'siap', msg: 'siap diunggah' }
        : { file: f, status: 'gagal', msg: 'format tidak didukung' });
    }
    render();
  }

  function readBase64(file) {
    return new Promise((resolve, reject) => {
      const r = new FileReader();
      r.onload = () => resolve(String(r.result).split(',')[1]);
      r.onerror = () => reject(new Error('gagal membaca file'));
      r.readAsDataURL(file);
    });
  }

  async function uploadOne(item) {
    const data = await readBase64(item.file);
    const res = await fetch(WEB_APP_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        name: item.file.name,
        mimeType: item.file.type || 'application/octet-stream',
        data
      })
    });
    const j = await res.json();
    if (!j.ok) throw new Error(j.error || 'gagal');
  }

  async function uploadAll() {
    $('upload').disabled = true;
    for (const item of queue) {
      if (item.status !== 'siap') continue;
      item.status = 'mengunggah';
      item.msg = 'mengunggah...';
      render();
      try {
        await uploadOne(item);
        item.status = 'selesai';
        item.msg = 'selesai';
      } catch (e) {
        item.status = 'gagal';
        item.msg = 'gagal: ' + e.message;
      }
      render();
    }
  }

  const drop = $('drop');
  ['dragenter', 'dragover'].forEach(ev => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.add('over'); }));
  ['dragleave', 'drop'].forEach(ev => drop.addEventListener(ev, (e) => { e.preventDefault(); drop.classList.remove('over'); }));
  drop.addEventListener('drop', (e) => addFiles(e.dataTransfer.files));
  $('files').addEventListener('change', (e) => { addFiles(e.target.files); e.target.value = ''; });
  $('upload').addEventListener('click', uploadAll);
  $('clear').addEventListener('click', () => { queue = queue.filter(q => q.status === 'mengunggah'); render(); });
  render();
})();
</script>
</body>
</html>
